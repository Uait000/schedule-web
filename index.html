        const APP_VERSION = '2.3.0'; 
        const savedVersion = localStorage.getItem('app_version');

        if (savedVersion !== APP_VERSION) {
          console.log('🚀 Обнаружена новая версия! Очистка системного кэша...');

          // 1. Удаляем все Service Workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
              for (let registration of registrations) {
                registration.unregister();
              }
            });
          }

          // 2. Очищаем Cache Storage (те самые 2.8 МБ со скриншота)
          if ('caches' in window) {
            caches.keys().then(names => {
              for (let name of names) caches.delete(name);
            });
          }

          // 3. Сохраняем новую версию
          localStorage.setItem('app_version', APP_VERSION);
          
          // 4. Мягко очищаем маршруты, чтобы избежать циклической ошибки
          localStorage.removeItem('lastVisitedRoute'); 

          // Даем небольшую паузу для завершения процессов и перезагружаем
          setTimeout(() => {
            window.location.reload(true);
          }, 500);
        }
      })();

      // Предохранитель на ошибки загрузки ресурсов (404)
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          const url = e.target.src || e.target.href;
          console.error('Критический ресурс не загружен:', url);
          window.location.reload();
        }
      }, true);
    </script>

    <style>
      .install-prompt {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--color-surface, #ffffff);
        border: 2px solid var(--color-primary, #1976d2);

        display: none;
      }

  <body>
    <div id="root"></div>
    
    <div id="install-prompt" class="install-prompt" style="display: none;">

    <script type="module" src="/src/main.tsx" onerror="window.location.reload()"></script>
    
    <script>
      function optimizeFontLoading() {
        if (document.fonts) {
          document.fonts.load('1em Material Icons').then(() => {
            document.documentElement.classList.add('fonts-loaded');
          }).catch(() => {
            console.log('Material Icons font load failed, using fallback');
          });
        }
      }

      class PWAInstaller {
        constructor() {
          this.deferredPrompt = null;
          this.installPrompt = document.getElementById('install-prompt');
          this.installButton = document.getElementById('install-button');
          this.cancelButton = document.getElementById('cancel-install');
          this.refreshing = false;
          
          this.init();
        }
        
        init() {
          this.setupEventListeners();
          this.registerServiceWorker();
          this.checkPWAStatus();
        }

        checkPWAStatus() {
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
          const isIOSStandalone = navigator.standalone;
          if (isStandalone || isIOSStandalone) {
            document.documentElement.classList.add('pwa-mode');
          }
        }
        
        setupEventListeners() {
          window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            this.deferredPrompt = e;
            setTimeout(() => { this.showInstallPrompt(); }, 5000);
          });
          
          window.addEventListener('appinstalled', () => {
            this.hideInstallPrompt();
            this.deferredPrompt = null;
            localStorage.setItem('pwaInstalled', 'true');
          });
          
          this.installButton.addEventListener('click', () => { this.installPWA(); });
          this.cancelButton.addEventListener('click', () => {
            this.hideInstallPrompt();
            localStorage.setItem('installPromptDismissed', Date.now().toString());
          });

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (this.refreshing) return;
              this.refreshing = true;
              window.location.reload();
            });
          }
        }
        
        showInstallPrompt() {
          if (localStorage.getItem('pwaInstalled') === 'true') return;
          const lastDismissed = localStorage.getItem('installPromptDismissed');
          if (lastDismissed) {
            const oneDay = 24 * 60 * 60 * 1000;
            if (Date.now() - parseInt(lastDismissed) < oneDay) return;
          }
          this.installPrompt.style.display = 'block';
        }
        
        hideInstallPrompt() { this.installPrompt.style.display = 'none'; }
        
        async installPWA() {
          if (!this.deferredPrompt) {
            this.showFallbackInstructions();
            return;
          }
          this.deferredPrompt.prompt();
          await this.deferredPrompt.userChoice;
          this.deferredPrompt = null;
          this.hideInstallPrompt();
        }
        
        showFallbackInstructions() {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          const isAndroid = /Android/.test(navigator.userAgent);
          let message = isIOS 
            ? 'Нажмите "Поделиться" 📤 и "На экран «Домой»"' 
            : 'Откройте меню браузера и выберите "Установить".';
          alert(message);
        }
        
        registerServiceWorker() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('✅ Service Worker зарегистрирован');
                
                registration.addEventListener('updatefound', () => {
                  const newWorker = registration.installing;
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      if (confirm('Доступна новая версия! Обновить сейчас?')) {
                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                        window.location.reload();
                      }
                    }
                  });
                });
              });
          }
        }
      }
      
      document.addEventListener('DOMContentLoaded', () => {
        optimizeFontLoading();
        new PWAInstaller();
      });
    </script>
